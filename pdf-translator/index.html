<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>PDF 英漢翻譯器</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#65728a;--line:#dce3ee;--paper:#fff;--bg:#f4f7fb;--blue:#2457d6;--blue2:#eaf0ff;--green:#147d56;--amber:#8a5a00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#172554;color:white;padding:26px max(20px,calc((100vw - 1080px)/2))}
header h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#d8e2ff}
main{max-width:1080px;margin:24px auto;padding:0 18px 60px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:20px;margin:0 0 16px;box-shadow:0 4px 18px #1725540a}
h2{font-size:18px;margin:0 0 13px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
input[type=text],select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit;background:white;color:var(--ink)}
input[type=file]{max-width:100%;padding:9px;border:1px dashed #9aa9c0;border-radius:9px;background:#f9fbff}
button{border:0;border-radius:9px;padding:11px 16px;background:var(--blue);color:white;font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf1f7;color:#26344d}.danger{background:#fff0ef;color:#a3322b}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}.status{padding:10px 12px;border-radius:9px;background:#f0f4fa;color:#42516a;font-size:14px;margin-top:12px}.status.ok{background:#e9f7f0;color:#126443}.status.warn{background:#fff5df;color:#795000}.status.err{background:#fff0ef;color:#9b2e28}
.progress{height:7px;background:#e8edf5;border-radius:10px;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:12px}
.segment{border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:12px}.segment-head{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:8px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.columns label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.columns textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px}
@media(max-width:700px){header{padding:20px}header h1{font-size:21px}.columns{grid-template-columns:1fr}.panel{padding:15px}.row>*{flex-basis:100%}}
</style>
</head>
<body>
<header><h1>PDF 英漢翻譯器</h1><p>在瀏覽器讀取 PDF，逐段翻譯並對照原文。第一版先支援可選取文字的 PDF。</p></header>
<main>
<section class="panel">
<h2>1. 選擇 PDF</h2>
<div class="row"><input id="pdfFile" type="file" accept="application/pdf,.pdf"><button id="extractBtn" disabled>讀取 PDF 文字</button></div>
<p class="note">PDF 會在你的瀏覽器本機解析；原始 PDF 不會直接上傳到翻譯伺服器。掃描圖片版 PDF 暫未支援 OCR。</p>
<div id="fileStatus" class="status">請先選擇一份 PDF 檔案。</div>
<div class="stats"><span id="pageStat">頁數：—</span><span id="charStat">文字：—</span><span id="chunkStat">段落：—</span></div>
</section>
<section class="panel">
<h2>2. 翻譯設定</h2>
<div class="row">
<div><label for="apiUrl">翻譯後端網址</label><input id="apiUrl" type="text" placeholder="例如：https://你的後端網址"></div>
<div style="max-width:190px"><label for="targetLang">譯文語言</label><select id="targetLang"><option value="zh-TW">繁體中文</option><option value="zh-CN">簡體中文</option></select></div>
</div>
<p class="note">後端尚未部署時，翻譯按鈕不會產生假譯文。後端接口規格見專案 README。</p>
<div class="row" style="margin-top:14px"><button id="checkBtn" class="secondary">測試後端連線</button><button id="translateBtn" disabled>開始翻譯</button><button id="exportBtn" class="secondary" disabled>匯出雙語 TXT</button></div>
<div id="apiStatus" class="status warn">尚未連接翻譯後端。</div><div class="progress"><i id="progressBar"></i></div>
</section>
<section class="panel">
<h2>3. 原文與譯文對照</h2>
<div id="results" class="empty">讀取 PDF 後，段落會顯示在這裡。</div>
</section>
<footer>PDF 英漢翻譯器 · 目前為早期測試版。請勿上傳含有敏感個人資料的文件。</footer>
</main>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
const $ = id => document.getElementById(id);
let segments = [];
let sourceName = "document";
const setStatus = (id,msg,type="") => { const el=$(id);el.textContent=msg;el.className="status "+type; };
function splitText(text){
  const normalized=text.replace(/\r/g,"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  const paras=normalized.split(/\n\s*\n/).map(x=>x.replace(/\s*\n\s*/g," ").trim()).filter(Boolean);
  const out=[];let buf="";
  for(const p of paras){if((buf+"\n\n"+p).length>2200&&buf){out.push(buf);buf=p}else{buf=buf?buf+"\n\n"+p:p}}
  if(buf)out.push(buf);
  return out.length?out:normalized.match(/[\s\S]{1,1800}/g)||[];
}
function render(){
 const host=$("results");host.className="";
 if(!segments.length){host.className="empty";host.textContent="沒有可顯示的文字。";return}
 host.innerHTML="";
 segments.forEach((s,i)=>{
  const card=document.createElement("article");card.className="segment";
  const head=document.createElement("div");head.className="segment-head";head.textContent="段落 "+(i+1);
  const cols=document.createElement("div");cols.className="columns";
  const left=document.createElement("div"),right=document.createElement("div");
  const ll=document.createElement("label");ll.textContent="英文原文";
  const lt=document.createElement("textarea");lt.value=s.source;lt.readOnly=true;
  const rl=document.createElement("label");rl.textContent="中文譯文（可手動修改）";
  const rt=document.createElement("textarea");rt.value=s.translation||"";rt.placeholder="翻譯結果會顯示在這裡…";rt.addEventListener("input",()=>s.translation=rt.value);
  left.append(ll,lt);right.append(rl,rt);cols.append(left,right);card.append(head,cols);host.append(card);
 });
}
$("pdfFile").addEventListener("change",()=>{$("extractBtn").disabled=!$("pdfFile").files.length;setStatus("fileStatus",$("pdfFile").files[0]?.name||"請選擇 PDF。");});
$("extractBtn").addEventListener("click",async()=>{
 const file=$("pdfFile").files[0];if(!file)return;
 try{
  $("extractBtn").disabled=true;setStatus("fileStatus","正在本機讀取 PDF…");
  const data=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjsLib.getDocument({data}).promise;
  let all=[];
  for(let n=1;n<=pdf.numPages;n++){
   const page=await pdf.getPage(n);const content=await page.getTextContent();
   const lines=[];let current="",lastY=null;
   for(const item of content.items){if(!("str" in item))continue;const y=item.transform?.[5];
    if(lastY!==null&&Math.abs(y-lastY)>4&&current){lines.push(current);current=""}
    current+=(current?" ":"")+item.str;lastY=y;
   }
   if(current)lines.push(current);all.push(lines.join("\n"));
  }
  const text=all.join("\n\n");segments=splitText(text).map(source=>({source,translation:""}));sourceName=file.name.replace(/\.pdf$/i,"")||"translated";
  $("pageStat").textContent="頁數："+pdf.numPages;$("charStat").textContent="文字："+text.length.toLocaleString();$("chunkStat").textContent="段落："+segments.length;
  $("translateBtn").disabled=!segments.length;$("exportBtn").disabled=!segments.length;
  setStatus("fileStatus",text.trim()?"文字提取完成。原始 PDF 未上傳。":"沒有提取到文字；這可能是掃描圖片版 PDF，需要 OCR。",text.trim()?"ok":"warn");render();
 }catch(e){setStatus("fileStatus","讀取失敗："+e.message,"err")}finally{$("extractBtn").disabled=false}
});
function apiBase(){return $("apiUrl").value.trim().replace(/\/$/,"")}
$("checkBtn").addEventListener("click",async()=>{
 const base=apiBase();if(!base){setStatus("apiStatus","請先輸入已部署的後端網址。","warn");return}
 try{const r=await fetch(base+"/health");if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();setStatus("apiStatus","後端連線成功："+(j.status||"ok"),"ok")}
 catch(e){setStatus("apiStatus","連線失敗："+e.message+"。請確認網址、HTTPS 與 CORS 設定。","err")}
});
$("translateBtn").addEventListener("click",async()=>{
 const base=apiBase();if(!base){setStatus("apiStatus","尚未設定後端網址；目前不能進行真實翻譯。","warn");return}
 $("translateBtn").disabled=true;let done=0;
 try{
  for(let i=0;i<segments.length;i++){
   const s=segments[i];setStatus("apiStatus","正在翻譯第 "+(i+1)+" / "+segments.length+" 段…");
   const r=await fetch(base+"/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:s.source,target_language:$("targetLang").value})});
   if(!r.ok)throw new Error("第 "+(i+1)+" 段失敗：HTTP "+r.status);
   const data=await r.json();if(typeof data.translation!=="string")throw new Error("後端回應格式不正確");
   s.translation=data.translation;done++;$("progressBar").style.width=(done/segments.length*100)+"%";render();
  }
  setStatus("apiStatus","翻譯完成，共 "+done+" 段。你可以修改譯文並匯出。","ok");
 }catch(e){setStatus("apiStatus",e.message+"；已完成 "+done+" 段，可稍後重試。","err")}
 finally{$("translateBtn").disabled=false}
});
$("exportBtn").addEventListener("click",()=>{
 const text=segments.map((s,i)=>"第 "+(i+1)+" 段\n[英文原文]\n"+s.source+"\n\n[中文譯文]\n"+(s.translation||"（尚未翻譯）")).join("\n\n"+"=".repeat(48)+"\n\n");
 const blob=new Blob(["\ufeff"+text],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=sourceName+"_中英對照.txt";a.click();URL.revokeObjectURL(a.href);
});
</script>
</body></html>
